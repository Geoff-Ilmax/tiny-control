# nfpm config used by .github/workflows/release.yml to build the .deb, .rpm and
# Arch packages for a tagged release. PKG_ARCH (amd64|arm64) and PKG_VERSION are
# supplied by the workflow; the binaries come from the per-arch build jobs.
#
# Build one locally with:
#   cp -r staging/bin-amd64 staging/current
#   PKG_ARCH=amd64 PKG_VERSION=0.1.0 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: tiny-control
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: Geoff-Ilmax <Geoff-Ilmax@users.noreply.github.com>
vendor: tiny-control
homepage: https://github.com/Geoff-Ilmax/tiny-control
license: MIT
description: |
  Linux control suite for the OBSBOT Tiny 3 series webcam.
  Sleep/wake, AI tracking, gimbal (PTZ), white balance, HDR and FOV over the
  camera's UVC extension unit, plus a white-balance guard daemon and optional
  Omarchy/Hyprland integration. The binaries are statically linked (musl).

# The binaries are static, so there is no runtime library dependency. mpv is
# only needed by the optional `tiny-preview` self-view window.
recommends:
  - mpv
suggests:
  - v4l-utils

contents:
  - src: ./staging/current/tinyctl
    dst: /usr/bin/tinyctl
  - src: ./staging/current/tiny-guard
    dst: /usr/bin/tiny-guard
  - src: ./bin/tiny-preview
    dst: /usr/bin/tiny-preview

  # Per-user systemd unit: systemctl --user enable --now tiny-guard.service
  - src: ./packaging/systemd/tiny-guard.service
    dst: /usr/lib/systemd/user/tiny-guard.service

  # udev: group access + the cold-plug white-balance pin
  - src: ./packaging/udev/71-tiny-control.rules
    dst: /usr/lib/udev/rules.d/71-tiny-control.rules

  - src: ./packaging/config.example
    dst: /etc/tiny-control/config
    type: config|noreplace

  # Example Hyprland/Omarchy snippets — copied by the user, never auto-applied.
  - src: ./packaging/hypr/tiny-control.conf
    dst: /usr/share/tiny-control/hypr/tiny-control.conf
  - src: ./packaging/hypr/bindings.omarchy.lua
    dst: /usr/share/tiny-control/hypr/bindings.omarchy.lua
  - src: ./packaging/hypr/windows.omarchy.lua
    dst: /usr/share/tiny-control/hypr/windows.omarchy.lua
  - src: ./packaging/omarchy-menu.jsonc
    dst: /usr/share/tiny-control/omarchy/omarchy-menu.jsonc

  - src: ./README.md
    dst: /usr/share/doc/tiny-control/README.md
  - src: ./PROTOCOL.md
    dst: /usr/share/doc/tiny-control/PROTOCOL.md
  - src: ./packaging/config.example
    dst: /usr/share/doc/tiny-control/config.example
  - src: ./LICENSE
    dst: /usr/share/licenses/tiny-control/LICENSE

rpm:
  group: Applications/System
deb:
  fields:
    Bugs: https://github.com/Geoff-Ilmax/tiny-control/issues
archlinux:
  pkgbase: tiny-control
