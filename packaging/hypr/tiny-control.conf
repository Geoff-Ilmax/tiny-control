# Example Hyprland keybindings for tiny-control (vanilla Hyprland `.conf` form).
#
# For OMARCHY users: do NOT source this file. Omarchy configures Hyprland in
# Lua — copy the snippets from `bindings.omarchy.lua` into
# ~/.config/hypr/bindings.lua instead.
#
# For vanilla Hyprland: source this from your hyprland.conf, e.g.
#   source = ~/.config/hypr/tiny-control.conf
# then adjust the key combos to taste (these use SUPER+ALT to avoid clashes).
#
# `-c selected` acts on the camera chosen with `tinyctl select <camera>` (or
# in the Omarchy bar widget).

# Camera sleep toggle — the headline feature. Notifies the resulting state.
bind = SUPER ALT, C, exec, sh -c 'notify-send -a tiny-control "Camera" "$(tinyctl -c selected toggle 2>&1)"'

# Recenter the gimbal (park).
bind = SUPER ALT, R, exec, tinyctl -c selected recenter

# Toggle AI subject tracking. Notifies the resulting state.
bind = SUPER ALT, T, exec, sh -c 'notify-send -a tiny-control "Camera" "Tracking $(tinyctl -c selected track toggle 2>&1)"'

# Cycle the selected camera.
bind = SUPER ALT, N, exec, sh -c 'notify-send -a tiny-control "Camera" "$(tinyctl select next 2>&1)"'

# Pinned to one camera regardless of the selection (alias set with `tinyctl alias`):
# bind = SUPER ALT, 1, exec, tinyctl -c main toggle
# Every camera at once:
# bind = SUPER ALT, S, exec, tinyctl -c all sleep
