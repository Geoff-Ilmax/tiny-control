[package]
name = "tiny-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Linux control suite for OBSBOT Tiny 2 and Tiny 3 series webcams, with multi-camera support (sleep/wake, AI tracking, gimbal, white balance)"
authors = ["Josh Lambert", "Geoff-Ilmax"]
license = "MIT"
repository = "https://github.com/Geoff-Ilmax/tiny-control"
readme = "README.md"
keywords = ["obsbot", "webcam", "uvc", "v4l2", "ptz"]
categories = ["command-line-utilities", "hardware-support"]

# Single small dependency: libc, for open/close/ioctl. Keeping the dependency
# surface minimal makes AUR packaging trivial and the build fast.
[dependencies]
libc = "0.2"

[lib]
name = "tiny_control"
path = "src/lib.rs"

[[bin]]
name = "tinyctl"
path = "src/bin/tinyctl.rs"

[[bin]]
name = "tiny-guard"
path = "src/bin/tiny_guard.rs"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
